name: "Sigbit MCP Auth Proxy"
slug: "sigbit_mcp_auth_proxy"
version: "1.0.0-dev.7"
description: "A lightweight proxy that adds authentication (OAuth/OIDC/password) to any MCP server."
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  80/tcp: 80
options:
  external_url: "http://localhost"
  password: ""
  google_client_id: ""
  google_client_secret: ""
  google_allowed_users: ""
  proxy_bearer_token: ""
  backend_command: ""
schema:
  external_url: str
  password: str
  google_client_id: str
  google_client_secret: str
  google_allowed_users: str
  proxy_bearer_token: str
  backend_command: str